#Configurer Docker Compose

name: smartcommerce-ai

services:
  ai-postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    container_name: smartcommerce-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SMARTCOMMERCE_AI_POSTGRES_DB}
      POSTGRES_USER: ${SMARTCOMMERCE_AI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SMARTCOMMERCE_AI_POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${SMARTCOMMERCE_AI_POSTGRES_PORT}:5432"

    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SMARTCOMMERCE_AI_POSTGRES_USER} -d ${SMARTCOMMERCE_AI_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ai_postgres_data: